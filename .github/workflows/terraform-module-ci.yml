name: Terraform Module CI
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  tflint:
    uses: Diehlabs/shared-workflows/.github/workflows/tflint.yml@24a1f9f961bd8279d3b0d8058a2969489521ca96 # main

  checkov:
    uses: Diehlabs/shared-workflows/.github/workflows/checkov.yml@24a1f9f961bd8279d3b0d8058a2969489521ca96 # main
    with:
      directory: ${{ github.workspace }}
    needs: tflint
    if: success()

  terrascan:
    uses: Diehlabs/shared-workflows/.github/workflows/terrascan.yml@24a1f9f961bd8279d3b0d8058a2969489521ca96 # main
    needs: tflint
    if: success()

  terratest:
    uses: Diehlabs/shared-workflows/.github/workflows/terratest.yml@24a1f9f961bd8279d3b0d8058a2969489521ca96 # main
    needs: tflint
    if: success()
    with:
      terraform_version: '1.0.8'

  release:
    uses: Diehlabs/shared-workflows/.github/workflows/github-release.yml@24a1f9f961bd8279d3b0d8058a2969489521ca96 # main
    needs: terratest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
